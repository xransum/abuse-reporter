[project]
name = "abuse-reporter"
version = "0.1.0"
description = "Abuse reporting agent for websites hosted on Dreamhost."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "xransum", email = "xransum@users.noreply.github.com" }]
requires-python = ">=3.11"
classifiers = ["Programming Language :: Python :: 3.11"]
dependencies = [
    "colorama>=0.4.6",
    "paramiko>=4.0.0",
    "python-dotenv>=1.0.0",
    "python-whois>=0.9.6",
    "querycontacts>=2.0.0",
    "requests>=2.32.5",
    "rich>=14.2.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.0.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "ruff>=0.15.0",
    "types-colorama>=0.4.15",
    "types-requests>=2.32.0",
]

[project.scripts]
abusereport = "abuse_reporter.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abuse_reporter"]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter (replaces black + isort + flake8)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "C4",   # flake8-comprehensions
    "PTH",  # flake8-use-pathlib
    "PLR",  # pylint refactor
    "BLE",  # flake8-blind-except
    "RUF",  # ruff-specific rules
]
ignore = [
    "S101",    # assert statements are fine in tests
    "S507",    # paramiko AutoAddPolicy is intentional
    "S601",    # paramiko exec_command is intentional
    "PLR2004", # magic value comparisons are fine where noted
    "PLR0913", # functions with many parameters are acceptable in this codebase
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy — static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
pretty = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "paramiko.*",
    "whois.*",
    "querycontacts.*",
    "colorama.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
